<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كتالوج الألوان</title>
<meta name="description" content="اختار ألوانك من الصور واطلب من هون">
<meta property="og:title" content="كتالوج الألوان">
<meta property="og:description" content="اختار ألوانك من الصور واطلب من هون">
<meta name="theme-color" content="#1a3a2a">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Reem+Kufi:wght@600;700&display=swap" media="print" onload="this.media='all'">
<script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{--g:#1a3a2a;--g2:#24533c;--gold:#c9a84c;--cream:#faf6ee;--paper:#fffdf8;--ink:#1f2a24;--mu:#7d7465;--ln:#e8e0cf;--rd:#b91c1c;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:'Tajawal',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.n{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.kufi{font-family:'Reem Kufi','Tajawal',sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px calc(110px + env(safe-area-inset-bottom,0px))}
.hero{background:linear-gradient(160deg,var(--g),var(--g2));color:#f5efe0;padding:calc(22px + env(safe-area-inset-top,0px)) 18px 22px;border-radius:0 0 26px 26px;margin:0 -14px 14px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.25),transparent 70%)}
.brand{font-size:.78rem;font-weight:800;color:var(--gold);letter-spacing:.02em}
.hero h1{margin:4px 0 6px;font-size:1.9rem;font-weight:700;line-height:1.2}
.hero p{margin:0;font-size:.86rem;color:#d7e3d9;font-weight:700}
.price{display:inline-flex;align-items:baseline;gap:5px;margin-top:10px;background:rgba(255,255,255,.1);border:1px solid rgba(201,168,76,.4);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.86rem}
.price b{color:var(--gold);font-size:1.05rem}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:12px;position:sticky;top:0;z-index:5;background:var(--cream);padding:8px 0}
.search{flex:1;display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--ln);border-radius:14px;padding:0 12px;height:46px}
.search input{flex:1;min-width:0;border:0;outline:none;font:inherit;font-size:.95rem;font-weight:700;background:none}
.tog{height:46px;border-radius:14px;border:1.5px solid var(--ln);background:#fff;padding:0 12px;font-size:.8rem;font-weight:800;white-space:nowrap}
.tog[aria-pressed="true"]{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;border:0;padding:0;background:var(--paper);border-radius:16px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.04),0 8px 18px -12px rgba(26,58,42,.45);text-align:start;display:flex;flex-direction:column}
.ph{aspect-ratio:1;background:#ece5d6 center/cover no-repeat;position:relative}
.num{position:absolute;top:7px;right:7px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:rgba(26,58,42,.92);color:#fff;display:grid;place-items:center;font-weight:900;font-size:.9rem;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pick{position:absolute;bottom:7px;left:7px;min-width:28px;height:28px;padding:0 7px;border-radius:999px;background:var(--gold);color:#1a1405;display:grid;place-items:center;font-weight:900;font-size:.82rem;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.cap{padding:7px 9px 9px;font-size:.78rem;font-weight:800;color:var(--ink);min-height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap small.stk{display:block;font-size:.7rem;font-weight:800;color:#166534;margin-top:1px}
.cap small.stk.low{color:#b45309}
.tile.out .ph{filter:grayscale(.85);opacity:.55}
.tile.out .cap{color:var(--rd)}
.tile.sel{box-shadow:0 0 0 3px var(--gold),0 8px 18px -12px rgba(26,58,42,.45)}
.sep{grid-column:1/-1;font-size:.8rem;font-weight:900;color:var(--mu);margin:10px 2px 0;display:flex;align-items:center;gap:8px}
.sep::after{content:'';flex:1;border-top:1.5px dashed var(--ln)}
.empty{text-align:center;color:var(--mu);font-weight:800;padding:40px 10px;line-height:1.9}
.foot{text-align:center;color:var(--mu);font-size:.74rem;font-weight:700;margin:24px 0 0;line-height:1.8}
/* سلّة */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:720px;z-index:20;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{display:flex;align-items:center;gap:10px;background:var(--g);color:#fff;border-radius:20px;padding:10px 10px 10px 14px;box-shadow:0 14px 30px -10px rgba(0,0,0,.45)}
.bar .t{flex:1;min-width:0}
.bar .t b{display:block;font-size:.95rem;font-weight:900}
.bar .t small{font-size:.74rem;color:#cfe0d5;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.wa{height:48px;border-radius:14px;border:0;background:#25d366;color:#05351a;font-weight:900;font-size:.92rem;padding:0 14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.edit{height:48px;border-radius:14px;border:1.5px solid rgba(255,255,255,.25);background:none;color:#fff;font-weight:800;font-size:.8rem;padding:0 10px}
/* عرض كبير */
.lb{position:fixed;inset:0;z-index:40;background:rgba(10,18,13,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:opacity .2s}
.lb.on{opacity:1;pointer-events:auto}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:1.1rem}
.lb .big{width:min(92vw,520px);aspect-ratio:1;border-radius:20px;background:#222 center/cover no-repeat;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5);touch-action:pan-y}
.lb .big .num{top:12px;right:12px;min-width:44px;height:44px;font-size:1.25rem}
.lb .nm{color:#fff;font-weight:900;font-size:1.15rem;margin-top:12px;text-align:center}
.lb .st{color:#f3c4c4;font-weight:800;font-size:.85rem;margin-top:2px;min-height:1.2em}
.lb .row{display:flex;align-items:center;gap:10px;margin-top:14px;width:min(92vw,520px)}
.nav{width:52px;height:52px;border-radius:14px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:1.3rem;flex:0 0 auto}
.qty{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;border-radius:14px;height:52px}
.qty button{width:42px;height:42px;border-radius:12px;border:0;background:var(--cream);font-size:1.3rem;font-weight:900}
.qty b{min-width:34px;text-align:center;font-size:1.3rem;font-weight:900}
.add{height:52px;border-radius:14px;border:0;background:var(--gold);color:#1a1405;font-weight:900;font-size:.95rem;padding:0 16px;flex:0 0 auto}
.add.on{background:#25d366;color:#05351a}
/* شيت الطلب */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:31;width:100%;max-width:720px;max-height:85%;background:var(--paper);border-radius:22px 22px 0 0;transform:translate(-50%,103%);transition:transform .25s;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{margin:0;padding:16px 16px 10px;font-size:1.05rem;border-bottom:2px solid var(--g)}
.sl{overflow-y:auto;padding:6px 16px}
.si{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}
.si i{width:44px;height:44px;border-radius:10px;background:#ece5d6 center/cover;flex:0 0 auto}
.si .m{flex:1;min-width:0;font-weight:900}
.si .m small{display:block;font-size:.72rem;color:var(--mu);font-weight:700}
.si .q{display:flex;align-items:center;gap:6px}
.si .q button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--ln);background:#fff;font-weight:900}
.sheet .go{margin:12px 16px 16px;height:54px;border-radius:16px;border:0;background:#25d366;color:#05351a;font-weight:900;font-size:1rem}
.wa.ms{background:#0a7cff;color:#fff}
.sheet .go.ms{background:#0a7cff;color:#fff}
/* بيانات الزبون */
.ck{overflow-y:auto;padding:10px 16px 4px}
.ck label{display:block;font-size:.8rem;font-weight:900;color:var(--mu);margin:10px 2px 5px}
.ck label i{font-style:normal;font-weight:700;opacity:.75}
.ck input,.ck textarea{width:100%;border:1.5px solid var(--ln);border-radius:12px;background:#fff;font:inherit;font-size:1rem;font-weight:700;padding:11px 12px;outline:none}
.ck input:focus,.ck textarea:focus{border-color:var(--g)}
.ck textarea{resize:none;min-height:64px}
.ck .ar{display:flex;flex-wrap:wrap;gap:6px}
.ck .ar button{border:1.5px solid var(--ln);background:#fff;border-radius:999px;padding:7px 12px;font-size:.84rem;font-weight:800}
.ck .ar button[aria-pressed="true"]{background:var(--g);color:#fff;border-color:var(--g)}
.ck .sum{background:var(--cream);border:1.5px dashed var(--ln);border-radius:12px;padding:9px 11px;font-size:.82rem;font-weight:800;line-height:1.7}
.ck .err{color:var(--rd);font-size:.8rem;font-weight:800;min-height:1.2em;margin:6px 2px 0}
.done{padding:26px 18px 6px;text-align:center}
.done .ok{width:64px;height:64px;border-radius:50%;background:#dcfce7;color:#166534;display:grid;place-items:center;font-size:2rem;margin:0 auto 10px}
.done h4{margin:0 0 6px;font-size:1.2rem}
.done p{margin:0;color:var(--mu);font-weight:700;font-size:.88rem;line-height:1.8}
.done .ref{display:inline-block;margin-top:8px;background:var(--cream);border:1.5px dashed var(--gold);border-radius:10px;padding:4px 12px;font-weight:900}
/* الصفحة الرئيسية: المنتجات */
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(201,168,76,.45);background:rgba(255,255,255,.08);color:#f5efe0;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:800;margin-bottom:8px}
.hp{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){.hp{grid-template-columns:repeat(3,1fr)}}
.pc{position:relative;border:0;padding:0;background:var(--paper);border-radius:18px;overflow:hidden;text-align:start;box-shadow:0 2px 0 rgba(0,0,0,.04),0 10px 22px -14px rgba(26,58,42,.5);display:flex;flex-direction:column}
.pc.sel{box-shadow:0 0 0 3px var(--gold),0 10px 22px -14px rgba(26,58,42,.5)}
.pc .im{aspect-ratio:1;background:#ece5d6 center/cover no-repeat;position:relative;display:grid;place-items:center;font-size:2.4rem}
.pc .bd{padding:9px 11px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.pc b{font-size:.95rem;font-weight:900;line-height:1.3}
.pc small{font-size:.76rem;font-weight:800;color:var(--g2)}
.pc small.mu{color:var(--mu);font-weight:700}
.pc .in{position:absolute;top:8px;left:8px;background:var(--gold);color:#1a1405;border-radius:999px;padding:3px 9px;font-weight:900;font-size:.76rem;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pc .go2{margin-top:6px;display:flex;align-items:center;justify-content:center;height:38px;border-radius:11px;background:var(--g);color:#fff;font-weight:900;font-size:.84rem}
.pc .pq{margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.pc .pq button{height:38px;min-width:38px;border-radius:11px;border:1.5px solid var(--ln);background:#fff;font-weight:900}
.pc .pq .add1{flex:1;background:var(--g);color:#fff;border-color:var(--g);font-size:.84rem}
.pc.out .im{filter:grayscale(.8);opacity:.6}
/* قائمة (قياسات / ألوان بلا صور) */
.rows{display:flex;flex-direction:column;gap:8px}
.rw{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:14px;padding:10px 12px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 14px -12px rgba(26,58,42,.5)}
.rw.out{opacity:.5}
.rw.sel{box-shadow:0 0 0 2px var(--gold)}
.rw .m{flex:1;min-width:0;font-weight:900;font-size:.95rem}
.rw .m small{display:block;font-size:.74rem;font-weight:800;color:#166534}
.rw.out .m small{color:var(--rd)}
.rw .q{display:flex;align-items:center;gap:8px}
.rw .q button{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--ln);background:#fff;font-weight:900;font-size:1.05rem}
.rw .q b{min-width:22px;text-align:center;font-weight:900}
.sg{font-size:.78rem;font-weight:900;color:var(--g2);padding:10px 0 2px}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,14px);background:var(--g);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;font-size:.86rem;opacity:0;transition:.22s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.skel{aspect-ratio:1;border-radius:16px;background:linear-gradient(90deg,#ece5d6,#f5efe3,#ece5d6);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <button class="back" id="back" hidden>→ كل المنتجات</button>
    <div class="brand">الكسواني روزميري</div>
    <h1 class="kufi" id="pName">كتالوج الألوان</h1>
    <p id="pSub">عم نجهّز الكتالوج…</p>
    <div class="price" id="pPrice" hidden>سعر القطعة <b class="n" id="pPriceV"></b> د.أ</div>
  </header>
  <div class="tools" id="tools" hidden>
    <label class="search">🔎<input id="q" inputmode="numeric" placeholder="دوّر برقم اللون" autocomplete="off"></label>
    <button class="tog" id="onlyAv" aria-pressed="false">المتوفّر بس</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot"></div>
</div>

<div class="bar" id="bar" hidden><div class="in">
  <div class="t"><b id="barT"></b><small id="barS"></small></div>
  <button class="edit" id="barEdit">✎ طلبي</button>
  <button class="wa" id="barWa">💬 اطلب</button>
</div></div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="اللون">
  <button class="x" id="lbX" aria-label="سكّر">✕</button>
  <div class="big" id="lbImg"><span class="num n" id="lbNum"></span></div>
  <div class="nm" id="lbNm"></div><div class="st" id="lbSt"></div>
  <div class="row">
    <button class="nav" id="lbPrev" aria-label="اللي قبله">›</button>
    <div class="qty"><button id="qMinus" aria-label="أقل">−</button><b class="n" id="qV">1</b><button id="qPlus" aria-label="أكثر">＋</button></div>
    <button class="add" id="lbAdd">＋ لطلبي</button>
    <button class="nav" id="lbNext" aria-label="اللي بعده">‹</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><h3 class="kufi" id="shH">طلبي</h3>
  <div class="sl" id="sl"></div>
  <div class="ck" id="vForm" hidden>
    <div class="sum" id="ckSum"></div>
    <label for="ckName">الاسم</label><input id="ckName" autocomplete="name" placeholder="اسمك">
    <label for="ckPhone">رقم الهاتف</label><input id="ckPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="07XXXXXXXX" style="direction:ltr;text-align:right">
    <label>المحافظة</label><div class="ar" id="ckArea"></div>
    <label for="ckAddr">العنوان</label><input id="ckAddr" autocomplete="street-address" placeholder="المنطقة، الشارع، أقرب معلم">
    <label for="ckMore">بدك إشي ثاني مش بالكتالوج؟ <i>(اختياري)</i></label><input id="ckMore" placeholder="اكتب اسمه — والموظف بيضيفه لطلبك">
    <label for="ckNotes">ملاحظات <i>(اختياري)</i></label><textarea id="ckNotes" placeholder="أي إشي بدك تحكيلنا ياه"></textarea>
    <div class="err" id="ckErr"></div>
  </div>
  <div id="vDone" hidden><div class="done"><div class="ok">✓</div><h4 class="kufi">وصل طلبك</h4><p id="doneP"></p><div class="ref n" id="doneRef"></div></div></div>
  <button class="go" id="sheetWa">✓ كمّل الطلب</button></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
// كتالوج موحّد: الصفحة الرئيسية فيها المنتجات اللي الأدمن اختارها (catalog_cfg.products)،
// الزبون بيفوت على النوع وبيختار ألوانه، وبيجمع من أكثر من منتج بطلب واحد.
// ?p=<منتج> بيفتح المنتج على طول (الروابط القديمة) و«كل المنتجات» بترجّعه للرئيسية.
const WA='962775665598';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2=v=>(Math.round((Number(v)||0)*100)/100).toFixed(2);
const digits=v=>String(v||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400);}
const QS=new URLSearchParams(location.search);
const PID0=String(QS.get('p')||'').slice(0,60);
// القناة (w واتساب / m ماسنجر) والموظف اللي بعت الرابط — الطلب بيوصله هو
const CH=QS.get('c')==='m'?'m':'w';
const EMP=String(QS.get('e')||'').slice(0,60);
const chName=()=>CH==='m'?'الماسنجر':'الواتساب';
const AREAS=['عمان','اربد','الزرقاء','البلقاء','مادبا','الكرك','الطفيلة','معان','العقبة','جرش','عجلون','المفرق','الاغوار','الشونة','الازرق','رصيفة'];
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

let db,CFG={},cfgReady=false;
let PR={},prSub={};             // المنتجات: id ⇒ بياناتها (null = مش موجود)
let OWN={},ownSub={};           // صور ألوان كل منتج بترقيمه الخاص: id ⇒ {رقم: صورة}
let LIB=null,libSub=null;       // المكتبة المشتركة
let HOME=[],allSub=null;        // ترتيب منتجات الرئيسية
let view=PID0?'prod':'home',CUR=PID0,fromHome=false;
let ITEMS=[],cur=-1,onlyAv=false;
// السلّة لكل الكتالوج: CART[id]={n:{رقم:كمية}} للألوان والقياسات، أو {q:كمية} للمنتج العادي
let CART=LS.get('_clrCart2',{});if(!CART||typeof CART!=='object')CART={};
const saveCart=()=>LS.set('_clrCart2',CART);
let ME=LS.get('_clrMe',{})||{};

// ── البيانات ──
const kind=p=>!p||!p.hasColorNumbers?'plain':p.ownColorNumbers?(p.cnKind==='size'?'size':'own'):'lib';
const word=p=>kind(p)==='size'?'قياس':'لون';
const pImg=p=>p&&(p.imageDataUrl||(Array.isArray(p.images)&&p.images[0])||p.img)||'';
function watchP(id){
  if(!id||prSub[id])return;
  prSub[id]=db.collection('operator_products').doc(id).onSnapshot(d=>{
    const v=d.exists&&d.data();PR[id]=(v&&!v.isRawMaterial)?{id,...v}:null;
    if(PR[id])need(PR[id]);changed();},()=>{PR[id]=null;changed();});

function need(p){
  const k=kind(p);
  if(k==='own'&&!ownSub[p.id])ownSub[p.id]=db.collection('own_color_imgs').where('pid','==',p.id).onSnapshot(s=>{
    const n={},o=OWN[p.id]||{};s.docs.forEach(x=>{const v=x.data();if(v&&v.img)n[String(v.num)]=v.img;});
    Object.keys(n).forEach(k=>{if(o[k]&&o[k]!==n[k])delete FULL['own__'+p.id+'__'+k];});   // صورة جديدة ⇒ الكبيرة كمان
    OWN[p.id]=n;changed();},()=>{OWN[p.id]=OWN[p.id]||{};});
  if(k==='lib'&&!libSub)libSub=db.collection('color_library').onSnapshot(s=>{
    const old={};(LIB||[]).forEach(c=>old[c.id]=c.img);
    LIB=s.docs.map(x=>({id:x.id,...x.data(),code:Number(x.data().code)||0}));
    LIB.forEach(c=>{if(old[c.id]&&old[c.id]!==c.img)delete FULL[c.id];});
    changed();},()=>{LIB=LIB||[];});
}
// خيارات منتج (ألوانه أو قياساته) — null يعني لسّا عم تنجاب
function opts(p){
  const k=kind(p);if(k==='plain')return [];
  if(k==='lib'){
    if(!LIB)return null;
    let L=LIB.filter(c=>c.code>0&&c.status!=='retired');
    const codes=Array.isArray(p.colorCodes)&&p.colorCodes.length?p.colorCodes.map(Number):null;
    if(codes)L=L.filter(c=>codes.includes(c.code));
    L=L.slice().sort((a,b)=>((a.sort==null?a.code:a.sort)-(b.sort==null?b.code:b.sort))||a.code-b.code);
    return L.map(c=>({key:c.id,num:c.code,tag:String(c.code),name:c.name||('لون '+c.code),img:c.img||'',hex:c.hex||'',
      stock:c.counted===true?Math.max(0,Number(c.qty)||0):null,out:c.status==='out'||(c.counted===true&&(Number(c.qty)||0)<=0)}));
  }
  const qm=(p.ownColorQty&&typeof p.ownColorQty==='object')?p.ownColorQty:{},size=k==='size',im=OWN[p.id]||{};
  const lbl=n=>{const l=size?((p.sizeLabels||{})[String(n)]):null;return (l!=null&&String(l).trim())?String(l).trim():String(n);};
  const L=Object.keys(qm).map(Number).filter(n=>n>0).map(n=>{const q=qm[String(n)],st=q==null?null:Math.max(0,Number(q)||0);
    return {key:'own__'+p.id+'__'+n,num:n,tag:lbl(n),name:(size?'قياس ':'لون ')+lbl(n),img:size?'':(im[String(n)]||''),hex:'',stock:st,out:st===0};});
  const v=x=>{const f=parseFloat(String(x.tag).replace('٫','.'));return isNaN(f)?1e9+x.num:f;};
  return L.sort((a,b)=>size?(v(a)-v(b)||a.num-b.num):a.num-b.num);
}
// ── السلّة ──
const cQ=(id,num)=>{const c=CART[id];if(!c)return 0;return num==null?(c.q||0):((c.n||{})[num]||0);};
const cTot=id=>{const c=CART[id];if(!c)return 0;return c.n?Object.values(c.n).reduce((t,q)=>t+q,0):(c.q||0);};
const cartEmpty=()=>!Object.keys(CART).some(id=>cTot(id)>0);
function setQ(id,num,q){
  q=Math.max(0,q|0);
  if(num==null){if(q>0)CART[id]={q};else delete CART[id];}
  else{const c=CART[id]&&CART[id].n?CART[id]:{n:{}};if(q>0)c.n[num]=q;else delete c.n[num];
    if(Object.keys(c.n).length)CART[id]=c;else delete CART[id];}
  saveCart();paint();
}
// المخزون تغيّر والزبون فاتح: اللي خلص بينشال واللي نقص بيتعدّل
function fixCart(){
  const gone=[],cut=[];
  Object.keys(CART).forEach(id=>{
    if(!(id in PR))return;
    const p=PR[id];
    if(!p){delete CART[id];return;}
    const c=CART[id],k=kind(p);
    if(k==='plain'){if(c.n)delete CART[id];return;}
    if(!c.n){delete CART[id];return;}
    const os=opts(p);if(!os)return;
    Object.keys(c.n).forEach(n=>{const o=os.find(x=>String(x.num)===n);
      if(!o||o.out){delete c.n[n];gone.push((p.name||'')+' '+(o?o.tag:n));}
      else if(o.stock!=null&&c.n[n]>o.stock){c.n[n]=o.stock;cut.push((p.name||'')+' '+o.tag+' ('+o.stock+')');}});
    if(!Object.keys(c.n).length)delete CART[id];
  });
  if(gone.length||cut.length){saveCart();
    toast('⚠️ '+(gone.length?gone.join('، ')+' خلص هلّأ — شلناه من طلبك':'')+(cut.length?(gone.length?' · ':'')+'الكمية نزلت: '+cut.join('، '):''));}
}
function lines(){
  return Object.keys(CART).map(id=>{const p=PR[id];if(!p||!cTot(id))return null;const c=CART[id],pr=Number(p.sellPrice)||0;
    if(c.n){const os=opts(p)||[];
      const cns=Object.keys(c.n).map(k=>{const o=os.find(x=>String(x.num)===k);return {num:Number(k),tag:o?o.tag:k,qty:c.n[k]};}).sort((a,b)=>a.num-b.num);
      return {pid:id,name:p.name||'',price:pr,qty:cns.reduce((t,i)=>t+i.qty,0),colorNumbers:cns,word:word(p)};}
    return {pid:id,name:p.name||'',price:pr,qty:c.q||0};}).filter(Boolean);
}

function showFormSum(){
  const XL=lines(),pcs=XL.reduce((t,x)=>t+x.qty,0),money=XL.reduce((t,x)=>t+x.qty*x.price,0);
  $('#ckSum').innerHTML=XL.map(x=>`<bdi>${esc(x.name)}</bdi>${x.colorNumbers?': '+x.colorNumbers.map(c=>`<bdi dir="ltr">${esc(c.tag)} ×${c.qty}</bdi>`).join('، '):' ×'+x.qty}`).join('<br>')+
    `<br><b class="n">${pcs}</b> قطعة`+(money>0?` · <b class="n">${f2(money)}</b> د.أ + التوصيل`:'');
}
function showForm(){
  sview='form';showFormSum();
  $('#ckName').value=ME.name||'';$('#ckPhone').value=ME.phone||'';$('#ckAddr').value=ME.address||'';$('#ckNotes').value='';$('#ckMore').value='';
  paintAreas(ME.area||'');$('#ckErr').textContent='';
  paintSheet();sheetOn();
  setTimeout(()=>{const f=[$('#ckName'),$('#ckPhone'),$('#ckAddr')].find(x=>!x.value);if(f)f.focus();},260);
}
let AREA='';
function paintAreas(a){AREA=a;$('#ckArea').innerHTML=AREAS.map(x=>`<button type="button" data-ar="${esc(x)}" aria-pressed="${x===a}">${esc(x)}</button>`).join('');}
function normPhone(v){let p=digits(v).replace(/\D/g,'');
  if(p.startsWith('00962'))p=p.slice(5);else if(p.startsWith('962'))p=p.slice(3);
  if(p.length===9&&p[0]==='7')p='0'+p;return p;}
function reqText(r){
  return `مرحبا 👋 سجّلت طلب من الكتالوج — رقم ${r.ref}\n`+r.extras.map(x=>'• '+lineTxt(x)).join('\n')+'\n'+(r.extraText?`✍️ بدّي كمان: ${r.extraText}\n`:'')+
    `\nالاسم: ${r.customer.name}\nالهاتف: ${r.customer.phone}\nالعنوان: ${r.customer.area} — ${r.customer.address}`+(r.customer.notes?`\nملاحظات: ${r.customer.notes}`:'');
}
// 🔒 الحجز: أوّل ما الزبون يثبّت، الكمية بتنخصم من المخزون بنفس اللحظة اللي بينحفظ فيها الطلب
// (معاملة وحدة) — فلو موظف الطلبات تأخّر بالتأكيد، ألوان الزبون محجوزة إله. واللون اللي ما
// انعدّ (ما إله رصيد معروف) ما في إشي نحجزه. لو اثنين طلبوا آخر قطعة، الثاني بيعرف شو ضلّ.
async function reserveAndSave(r,XL){
  const ref=db.collection('catalog_requests').doc();
  const ownIds=[...new Set(XL.filter(x=>x.colorNumbers&&kind(PR[x.pid])!=='lib').map(x=>x.pid))];
  const libNeed={};
  XL.filter(x=>x.colorNumbers&&kind(PR[x.pid])==='lib').forEach(x=>x.colorNumbers.forEach(c=>{libNeed[c.num]=(libNeed[c.num]||0)+c.qty;}));
  const libRefs=Object.keys(libNeed).map(code=>{const c=(LIB||[]).find(z=>z.code===Number(code));return c?{code,ref:db.collection('color_library').doc(c.id)}:null;}).filter(Boolean);
  let short=[],res={own:{},lib:{}};
  await db.runTransaction(async tx=>{
    short=[];res={own:{},lib:{}};const upd=[];
    const ownRefs=ownIds.map(id=>db.collection('operator_products').doc(id));
    const os=[];for(const rf of ownRefs)os.push(await tx.get(rf));
    const ls=[];for(const d of libRefs)ls.push(await tx.get(d.ref));
    os.forEach((sn,i)=>{const id=ownIds[i],qm=(sn.exists&&sn.data().ownColorQty)||{},u={};
      XL.filter(x=>x.pid===id).forEach(x=>x.colorNumbers.forEach(c=>{const have=qm[String(c.num)];
        if(have==null)return;
        const h=Number(have)||0;
        if(h<c.qty){short.push({pid:id,num:c.num,name:x.name+' — '+x.word+' '+c.tag,have:Math.max(0,h)});return;}
        u['ownColorQty.'+c.num]=h-c.qty;res.own[id+'|'+c.num]=c.qty;}));
      if(Object.keys(u).length)upd.push([ownRefs[i],u]);});
    ls.forEach((sn,i)=>{const d=libRefs[i],v=(sn.exists&&sn.data())||{};if(v.counted!==true)return;
      const h=Number(v.qty)||0,need=libNeed[d.code];
      if(v.status==='out'||h<need){short.push({lib:Number(d.code),name:'لون '+d.code,have:v.status==='out'?0:Math.max(0,h)});return;}
      upd.push([d.ref,{qty:h-need}]);res.lib[d.code]=need;});
    if(short.length)return;
    upd.forEach(([rf,u])=>tx.update(rf,u));
    tx.set(ref,{...r,reserved:Object.keys(res.own).length+Object.keys(res.lib).length>0,reservation:res});
  });
  r.reserved=!short.length&&Object.keys(res.own).length+Object.keys(res.lib).length>0;
  return short;
}
async function submitReq(){
  if(sending)return;
  const extraText=$('#ckMore').value.trim().slice(0,300);
  const name=$('#ckName').value.trim(),phone=normPhone($('#ckPhone').value),address=$('#ckAddr').value.trim(),notes=$('#ckNotes').value.trim();
  const err=m=>{$('#ckErr').textContent=m;};
  if(!name)return err('اكتب اسمك');
  if(!/^07[789]\d{7}$/.test(phone))return err('رقم الهاتف لازم يكون 10 أرقام ويبلّش بـ 077 / 078 / 079');
  if(!AREA)return err('اختار المحافظة');
  if(!address)return err('اكتب العنوان');
  const XL=lines();if(!XL.length)return err('طلبك فاضي');
  err('');
  ME={name,phone,area:AREA,address};LS.set('_clrMe',ME);
  const extras=XL.map(x=>({pid:x.pid,name:x.name,price:x.price,qty:x.qty,...(x.colorNumbers?{colorNumbers:x.colorNumbers.map(c=>({num:c.num,tag:String(c.tag),qty:c.qty}))}:{})}));
  const ref=Math.random().toString(36).slice(2,7).toUpperCase();
  const r={ref,pid:'',productName:extras.map(x=>x.name).join('، '),items:[],extras,...(extraText?{extraText}:{}),
    pieces:extras.reduce((t,x)=>t+x.qty,0),customer:{name,phone,area:AREA,address,notes},
    channel:CH==='m'?'messenger':'whatsapp',workerId:EMP,status:'new',source:'catalog',
    createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  sending=true;const b=$('#sheetWa');b.disabled=true;b.textContent='⏳ عم نسجّل طلبك…';
  let saved=false,short=[];
  try{short=await Promise.race([reserveAndSave(r,XL),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),15000))]);saved=!short.length;}catch(e){}
  sending=false;b.disabled=false;
  if(short.length){
    // حدا سبقه على آخر القطع: منعدّل سلّته على الموجود ومنخلّيه يثبّت كمان مرّة
    short.forEach(x=>{
      if(x.lib!=null){Object.keys(CART).forEach(id=>{const p=PR[id];if(p&&kind(p)==='lib'&&CART[id].n&&CART[id].n[x.lib])setQ(id,x.lib,x.have);});}
      else setQ(x.pid,x.num,x.have);});
    paintSheet();
    err('⚠️ '+short.map(x=>x.have?`الموجود من ${x.name} صار ${x.have} بس`:`${x.name} خلص هلّأ`).join('، ')+' — عدّلنا طلبك، راجعه واضغط «ثبّت» كمان مرّة');
    showFormSum();return;
  }
  r.text=reqText(r);lastReq=r;
  if(!saved){paintSheet();toast('النت ضعيف — ابعتلنا الطلب على '+chName());openChat(r.text);return;}
  CART={};saveCart();render();paint();
  sview='done';
  $('#doneP').innerHTML=`سجّلنا طلبك${r.reserved?' و<b>ألوانك محجوزة إلك 24 ساعة</b> 🔒':''}<br>بنتواصل معك على <b class="n">${esc(phone)}</b> لنأكّد.<br>ابعتلنا تأكيد على ${chName()} عشان يوصلك ردّنا أسرع 👇`;
  $('#doneRef').textContent='رقم الطلب '+ref;
  paintSheet();
}
// فتح المحادثة على نفس القناة اللي إجا منها الزبون
function chatUrl(text){
  if(CH==='m'){const u=String(CFG.messengerUser||'').replace(/^@/,'').trim();return u?`https://m.me/${encodeURIComponent(u)}?text=${encodeURIComponent(text)}`:'';}
  const n=String(CFG.waNumber||WA).replace(/\D/g,'')||WA;return `https://wa.me/${n}?text=${encodeURIComponent(text)}`;
}
async function openChat(text){
  if(CH==='m'){try{await navigator.clipboard.writeText(text);toast('📋 نسخنا الرسالة — الصقها بالماسنجر');}catch(e){}}
  const u=chatUrl(text);
  if(u)setTimeout(()=>{location.href=u;},CH==='m'?700:0);
  else toast('📋 نسخنا الرسالة — ابعتها لصفحتنا على الماسنجر');
}
function go(){
  if(sview==='done'&&$('#sheet').classList.contains('on')){openChat(lastReq.text);return;}
  if(cartEmpty()){toast('اختار إشي أوّل');return;}
  if(!$('#sheet').classList.contains('on')||sview==='done'){showForm();return;}
  if(sview==='cart'){showForm();return;}
  submitReq();
}
// زيادة مع سقف المخزون
function bump(id,num,d){
  const p=PR[id];if(!p)return false;
  if(num==null){setQ(id,null,cQ(id,null)+d);return true;}
  const o=(opts(p)||[]).find(x=>x.num===num);const nv=cQ(id,num)+d;
  if(d>0&&o&&(o.out||(o.stock!=null&&nv>o.stock))){toast(o.out?o.name+' خلص':'الموجود من '+o.name+' '+o.stock+' بس');return false;}
  setQ(id,num,nv);return true;
}

// ── الأحداث ──
document.addEventListener('click',e=>{
  const op=e.target.closest('[data-open]');if(op){openProd(op.dataset.open,true);return;}
  if(e.target.closest('[data-home]')){showHome();return;}
  const t=e.target.closest('[data-i]');if(t){openLb(Number(t.dataset.i));return;}
  const ar=e.target.closest('[data-ar]');if(ar){paintAreas(ar.dataset.ar);$('#ckErr').textContent='';return;}
  const pq=e.target.closest('[data-pq]');if(pq){const [id,d]=pq.dataset.pq.split(':');const was=cTot(id);bump(id,null,Number(d));
    if(!was&&cTot(id))toast('✓ انضاف '+((PR[id]&&PR[id].name)||''));render();return;}
  const cq=e.target.closest('[data-cq]');if(cq){const [n,d]=cq.dataset.cq.split(':');bump(CUR,Number(n),Number(d));render();return;}
  const sq=e.target.closest('[data-sq]');if(sq){const [id,n,d]=sq.dataset.sq.split(':');bump(id,n===''?null:Number(n),Number(d));render();
    if(cartEmpty())closeSheet();return;}
});
$('#back').onclick=()=>showHome();
$('#lbX').onclick=()=>closeLb();
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb();});
$('#lbPrev').onclick=()=>step(-1);$('#lbNext').onclick=()=>step(1);
$('#qMinus').onclick=()=>{const x=ITEMS[cur];if(!x)return;qv=Math.max(1,qv-1);$('#qV').textContent=qv;if(cQ(CUR,x.num)){setQ(CUR,x.num,qv);render();}};
$('#qPlus').onclick=()=>{const x=ITEMS[cur];if(!x)return;const mx=x.stock!=null?x.stock:999;
  if(qv>=mx){toast('الموجود من '+x.name+' '+mx+' بس');return;}
  qv=qv+1;$('#qV').textContent=qv;if(cQ(CUR,x.num)){setQ(CUR,x.num,qv);render();}};
$('#lbAdd').onclick=()=>{const x=ITEMS[cur];if(!x||x.out)return;
  if(cQ(CUR,x.num)){setQ(CUR,x.num,0);toast('انشال من طلبك');}
  else{setQ(CUR,x.num,qv);toast('✓ انضاف '+x.name);}
  lbPaint();render();};
(function(){let x0=null;const el=$('#lbImg');el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
  el.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)step(dx>0?1:-1);},{passive:true});})();
$('#q').addEventListener('input',()=>render());
$('#onlyAv').onclick=()=>{onlyAv=!onlyAv;$('#onlyAv').setAttribute('aria-pressed',onlyAv);render();};
$('#barWa').onclick=go;$('#sheetWa').onclick=go;$('#barEdit').onclick=openSheet;$('#scrim').onclick=()=>closeSheet();
if(CH==='m')$('#barWa').classList.add('ms');
// زرّ الرجوع بالموبايل: بيسكّر الصورة أو الشيت، أو بيرجع لكل المنتجات
window.addEventListener('popstate',()=>{
  if(selfBack>0){selfBack--;return;}
  if($('#lb').classList.contains('on'))closeLb(true);
  else if($('#sheet').classList.contains('on'))closeSheet(true);
  else if(view==='prod'&&fromHome)showHome(true);
});
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('on'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')step(1);if(e.key==='ArrowRight')step(-1);});
window.addEventListener('DOMContentLoaded',()=>{if(!window.firebase){$('#grid').innerHTML='<div class="empty" style="grid-column:1/-1">ما قدرنا نحمّل الصفحة — تأكّد من النت</div>';return;}load();render();});
})();
</script>
