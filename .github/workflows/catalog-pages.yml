name: Catalog preview pages

# صفحات معاينة روابط الكتالوج (c/<المنتج>): بتنعاد كل ساعتين عشان
# المنتجات الجديدة وصورها تطلع بالواتساب — وبتقدر تشغّلها بإيدك.
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # sharp: كولاج صور المنتجات لمعاينة رابط الكتالوج
      - run: npm i --no-save --no-audit --no-fund sharp@0.33.5
      - run: node tools/catalog-pages.js
      - name: Commit if changed
        run: |
          git add -A c
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "catalog-pages-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "🔗 تحديث صفحات معاينة الكتالوج"
          git push
